syntax = "proto3";

package cluster;

// Índice 0 representa log vazio; entradas reais começam em 1.
// IDs são strings; string vazia representa líder ainda desconhecido.
service ClusterService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc Fetch(FetchRequest) returns (FetchResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc Read(ReadRequest) returns (ReadResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  FOLLOWER = 1;
  CANDIDATE = 2;
  LEADER = 3;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  string key = 3;
  string value = 4;
}

message GetStatusRequest {}

message GetStatusResponse {
  string node_id = 1;
  Role role = 2;
  uint64 term = 3;
  uint64 commit_index = 4;
  uint64 last_log_index = 5;
  string leader_id = 6;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4; // 0 quando o log está vazio.
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message FetchRequest {
  uint64 term = 1;
  string follower_id = 2;
  // Última entrada persistida; apenas um prefixo validado pelo líder
  // pode ser considerado confirmação de replicação para o quórum.
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message FetchResponse {
  uint64 term = 1;
  string leader_id = 2;
  bool is_leader = 3;
  uint64 commit_index = 4;
  repeated LogEntry entries = 5;
  // Prefixo exigido para aplicar entries: índice e termo devem coincidir
  // com o log local. (0, 0) representa o prefixo vazio.
  uint64 prev_log_index = 6;
  uint64 prev_log_term = 7;
  // Presente: remover entradas APÓS este índice antes de acrescentar entries.
  // Ausente: não há ordem de truncamento. Presente com 0: prefixo vazio.
  // Nunca remover entradas comitadas. Se o prefixo não coincidir, não aplicar
  // entries; Fetches posteriores devem negociar um prefixo anterior.
  optional uint64 truncate_after_index = 8;
  // Se is_leader=false, não aplicar entradas, truncamento ou commit.
}

message WriteRequest {
  string key = 1;
  string value = 2;
}

message WriteResponse {
  bool success = 1; // true somente após commit por quórum.
  string error = 2;
  string leader_id = 3;
  uint64 index = 4; // 0 quando nenhuma entrada foi atribuída.
}

message ReadRequest {
  string key = 1;
}

message ReadResponse {
  string value = 1;
  bool exists = 2; // Distingue valor vazio de chave inexistente.
  uint64 commit_index = 3;
}
