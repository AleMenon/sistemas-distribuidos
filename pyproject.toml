[project]
name = "sistemas-distribuidos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexandre Alberto Menon", email = "alexandrealberto.menon@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "pika>=1.4.4",
